name: benchmarks

# The benchmark corpus is the instrument this repository uses to keep performance
# and engagement-quality claims measurable rather than asserted. It is gated here
# so a change cannot quietly break it: the existing build workflow uses conda and
# cibuildwheel and runs no tests at all.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  # A newer push supersedes an in-flight run; do not burn minutes on zombies.
  group: benchmarks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  corpus:
    name: exact gates + corpus tests + strict typing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@v0.8.1
        with:
          environments: default
          cache: true

      # The native gates are the only automated check on the exact number
      # vocabulary's contracts: the frozen attestation byte literal, the
      # cross-root precondition, and the mixed-radical sign predicate (whose
      # degenerate-root folding is a soundness requirement, not an
      # optimisation -- see docs/exactness.md). They are EXCLUDE_FROM_ALL, so
      # nothing else in this repository ever builds or runs them; without this
      # step they are only exercised by whoever types the command locally.
      # Placed first so a broken exact contract fails before the corpus runs.
      - name: Exact-number native gates
        run: pixi run -e default exact-gates

      - name: Benchmark corpus tests
        run: pixi run pytest tests/benchmarks -q -n auto

      - name: Strict typing gate (benchmarks)
        run: pixi run mypy

      - name: Smoke corpus end to end
        run: pixi run python -m benchmarks.cli --corpus smoke --out "${RUNNER_TEMP}/bench" --no-digits

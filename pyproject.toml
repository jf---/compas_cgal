[build-system]
requires = ["scikit-build-core >=0.10", "nanobind >=1.3.2"]
build-backend = "scikit_build_core.build"

[project]
name = "compas_cgal"
description = "CGAL wrapper for COMPAS."
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "tom van mele", email = "tom.v.mele@gmail.com" },
    { name = "Petras Vestartas", email = "petrasvestartas@gmail.com" },
]
classifiers = [
    "License :: OSI Approved :: GNU Lesser General Public License v3 (LGPLv3)",
]
dependencies = [
    "compas",
    "numpy",
    "scipy",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/compas-dev/compas_cgal"

# ============================================================================
# replace pytest.ini
# ============================================================================

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = ["tests"]
# The `benchmarks` corpus is a top-level source package that is deliberately not
# shipped in the wheel, so it is never installed. `--import-mode=importlib` does
# not put the rootdir on sys.path, so tests/benchmarks/* could not import it.
pythonpath = ["."]
python_files = ["test_*.py", "*_test.py", "test.py"]
norecursedirs = [
    "external/*",
    "build/*",
    "dist/*",
    "*.egg-info",
    ".git",
    ".tox",
    ".env",
    ".pytest_cache",
    ".ruff_cache",
    ".hypothesis",
]
addopts = [
    "-ra",
    "--strict-markers",
    "--doctest-glob=*.rst",
    "--tb=short",
    "--import-mode=importlib",
]
doctest_optionflags = [
    "NORMALIZE_WHITESPACE",
    "IGNORE_EXCEPTION_DETAIL",
    "ALLOW_UNICODE",
    "ALLOW_BYTES",
    "NUMBER",
]

# ============================================================================
# scikit-build
# ============================================================================

[tool.scikit-build]
minimum-version = "build-system.requires"
build-dir = "build/{wheel_tag}"
wheel.py-api = "cp312"                    # Build all Python currently supported versions.
cmake.version = ">=3.15"
cmake.build-type = "Release"
editable.rebuild = true
# Pixi passes its frontend-owned `pixi-conda-environment` PEP 517 setting.
strict-config = false

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "src/compas_cgal/__init__.py"

[tool.scikit-build.cmake.define]
CMAKE_POLICY_DEFAULT_CMP0135 = "NEW"
CMAKE_OSX_DEPLOYMENT_TARGET = "11.0"

# ============================================================================
# cibuildwheel
# ============================================================================

[tool.cibuildwheel]
# build = ["cp38-*", "cp39-*", "cp31?-*"] # Build for specific Python versions.
build-verbosity = 3
test-requires = ["numpy", "compas", "pytest", "build"]
# The wheel smoke-tests its own extensions with files that import neither
# `benchmarks` nor hypothesis. The product gate (red on purpose,
# docs/red_manifest.json) and the exact-kernel suites run under pixi in
# .github/workflows/benchmarks.yml.
test-command = "pip install numpy compas && pip list && pytest {project}/tests/test_stock.py {project}/tests/test_straight_skeleton_2_interior_straight_skeleton.py {project}/tests/test_straight_skeleton_2_interior_straight_skeleton_with_holes.py {project}/tests/test_replay_classification.py -q"
build-frontend = "pip"
manylinux-x86_64-image = "manylinux2014"
skip = ["*_i686", "*-musllinux_*", "*-win32", "pp*"]
macos.environment.MACOSX_DEPLOYMENT_TARGET = "11.00"
macos.archs = ["x86_64", "arm64"]

# ============================================================================
# replace bumpversion.cfg
# ============================================================================

[tool.bumpversion]
current_version = "0.9.1"
message = "Bump version to {new_version}"
commit = true
tag = true

[[tool.bumpversion.files]]
filename = "src/compas_cgal/__init__.py"
search = "{current_version}"
replace = "{new_version}"

[[tool.bumpversion.files]]
filename = "CHANGELOG.md"
search = "Unreleased"
replace = "[{new_version}] {now:%Y-%m-%d}"

# ============================================================================
# replace setup.cfg
# ============================================================================

[tool.ruff]
line-length = 179
indent-width = 4
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["I001"]
"tests/*" = ["I001"]
"tasks.py" = ["I001"]

[tool.ruff.lint.isort]
force-single-line = true

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.pycodestyle]
max-doc-length = 179

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = "dynamic"

# ============================================================================
# pixi
# ============================================================================

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64"]

[tool.pixi.dependencies]
python = "3.12.*"
cmake = ">=3.15"
ninja = "*"
compas = "*"
numpy = "*"
scipy = "*"
poppler = "*"

[tool.pixi.pypi-dependencies]
compas-cgal = { path = ".", editable = true }
nanobind = ">=1.3.2"
scikit-build-core = ">=0.10"
build = "*"
pytest = ">=7"
pytest-xdist = "*"
pytest-testmon = "*"
hypothesis = "*"
ruff = "*"
mypy = "*"
jsonschema = "*"
types-jsonschema = "*"
# Figures only. `benchmarks.plotting` is the one importer; nothing under `src`
# depends on it, so the wheel never sees it.
matplotlib = ">=3.8"

[tool.pixi.pypi-options]
no-build-isolation = ["compas-cgal"]

[tool.pixi.feature.docs.dependencies]
python = "3.12.*"
compas = "*"

[tool.pixi.feature.docs.pypi-dependencies]
markdown-callouts = ">=0.4"
mkdocs-material = ">=9.5"
mkdocstrings = { version = "*", extras = ["python"] }

[tool.pixi.feature.docs.tasks]
docs = "mkdocs build --strict"

[tool.pixi.environments]
docs = { features = ["docs"], no-default-feature = true }

[tool.pixi.tasks]
held-native-curve-import = { cmd = "python -m benchmarks.held_native_curve_import_plot", description = "Plot native imports of prepared Held line/arc boundaries" }
held-native-curved-circle = { cmd = "python -m benchmarks.held_native_curved_circle_plot", depends-on = ["_editable-rebuild"], description = "Native curved medial circles on a prepared Held pocket; --case all --record-stops renders every case" }
held-curved-circle-benchmark = { cmd = "python -m benchmarks.held_curved_circle_benchmark --output build/held-curved-circle/current.json", depends-on = ["_editable-rebuild"], description = "Time the native curved-circle query on all four Held pockets into build/" }
held-curved-circle-baseline = { cmd = "python -m benchmarks.held_curved_circle_benchmark --output benchmarks/results/held_curved_circle_baseline.json", depends-on = ["_editable-rebuild"], description = "Deliberately re-record the committed curved-circle performance baseline" }
_held-curved-circle-plots = { cmd = "python -m benchmarks.held_native_curved_circle_plot --case all --record-stops", depends-on = ["_editable-rebuild"] }
_held-curved-circle-performance-plot = { cmd = "python -m benchmarks.held_curved_circle_performance_plot --current build/held-curved-circle/current.json --baseline benchmarks/results/held_curved_circle_baseline.json --output docs/assets/images/held_curved_circle_performance.png" }
held-curved-circle-figures = { depends-on = ["_held-curved-circle-plots", "held-curved-circle-benchmark", "_held-curved-circle-performance-plot"], description = "Rebuild the four construction figures, the benchmark record and the performance figure" }
held-toolpath-benchmark = { cmd = "python -m benchmarks.held_toolpath_benchmark --output build/held-toolpath-benchmark/current.json", depends-on = ["_editable-rebuild"], description = "Time the five Held toolpath generator workloads into build/ (geometry counts recorded with the time)" }
held-toolpath-baseline = { cmd = "python -m benchmarks.held_toolpath_benchmark --output benchmarks/results/held_toolpath_baseline.json", depends-on = ["_editable-rebuild"], description = "Deliberately re-record the committed toolpath generator baseline" }
_held-toolpath-figure5 = { cmd = "python -m benchmarks.tools.held_toolpath_progress --refine", depends-on = ["_editable-rebuild"] }
_held-toolpath-upper-lane = { cmd = "python -m benchmarks.tools.held_reference_toolpaths --case figure8_upper" }
_held-toolpath-upper-boundary = { cmd = "python -m benchmarks.tools.held_reference_toolpaths --case figure8_upper --spacing boundary" }
_held-toolpath-crossed-skis = { cmd = "python -m benchmarks.tools.held_reference_toolpaths --case figure8_crossed_skis --spacing boundary" }
_held-toolpath-monstera = { cmd = "python -m benchmarks.tools.held_reference_toolpaths --case figure8_monstera --spacing boundary --qualify-contacts --corner-approaches" }
_held-toolpath-figure6 = { cmd = "python -m benchmarks.tools.held_figure6_same_axes" }
_held-toolpath-figure5-current = { cmd = "python -m benchmarks.tools.held_toolpath_progress", depends-on = ["_editable-rebuild"] }
_held-toolpath-figure5-coverage-preserving = { cmd = "python -m benchmarks.tools.held_contour_bound_toolpaths --case figure5 --coverage-preserving", depends-on = ["_editable-rebuild"] }
_held-toolpath-upper-coverage-preserving = { cmd = "python -m benchmarks.tools.held_contour_bound_toolpaths --case figure8_upper --coverage-preserving", depends-on = ["_editable-rebuild"] }
held-toolpath-figures = { depends-on = ["_held-toolpath-figure5", "_held-toolpath-upper-lane", "_held-toolpath-upper-boundary", "_held-toolpath-crossed-skis", "_held-toolpath-monstera", "_held-toolpath-figure6"], description = "Rebuild every Held toolpath figure (Figure 5, the three Figure 8 pockets, Figure 6) through the generators, exact coverage checked" }
held-toolpath-gate = { cmd = "pytest benchmarks/acceptance/test_held_toolpath_performance_slow.py -q", depends-on = ["_editable-rebuild"], description = "Slow-tier toolpath generator gate (upper, Monstera), about ten minutes; not collected by pytest" }
_editable-rebuild = '''python -c "from compas_cgal import _containment_2, _coverage_2, _medial_axis_2, _stock_2, _toolpath"'''
pytest = { cmd = '''editable_build_dir="$(python -c 'import sys; print(next(f.path for f in sys.meta_path if hasattr(f, "known_wheel_files") and "compas_cgal._stock_2" in f.known_wheel_files))')" && SKBUILD_EDITABLE_SKIP="$editable_build_dir" pytest''', depends-on = ["_editable-rebuild"] }
baseline = { cmd = '''editable_build_dir="$(python -c 'import sys; print(next(f.path for f in sys.meta_path if hasattr(f, "known_wheel_files") and "compas_cgal._stock_2" in f.known_wheel_files))')" && SKBUILD_EDITABLE_SKIP="$editable_build_dir" pytest tests -n auto --dist=loadgroup -q''', depends-on = ["_editable-rebuild"] }
# Exit 1 carries deliberate reds in JUnit for the manifest checker to decide.
# Exit 2+ is infrastructure/collection failure and must stop the task chain.
# loadgroup co-locates only explicitly marked expensive module fixtures.
_junit-baseline = { cmd = '''sh -c 'editable_build_dir="$(python -c "import sys; print(next(f.path for f in sys.meta_path if hasattr(f, \"known_wheel_files\") and \"compas_cgal._stock_2\" in f.known_wheel_files))")" || exit $?; SKBUILD_EDITABLE_SKIP="$editable_build_dir" pytest tests -n auto --dist=loadgroup -q --junitxml=build/junit-baseline.xml; pytest_status=$?; if [ "$pytest_status" -le 1 ]; then exit 0; fi; exit "$pytest_status"' ''', depends-on = ["_editable-rebuild"] }
red-manifest = { cmd = "python -m tools.red_manifest build/junit-baseline.xml", depends-on = ["_junit-baseline"], description = "Suite reds must equal docs/red_manifest.json, both directions" }
gate-vectors = { cmd = '''editable_build_dir="$(python -c 'import sys; print(next(f.path for f in sys.meta_path if hasattr(f, "known_wheel_files") and "compas_cgal._stock_2" in f.known_wheel_files))')" && SKBUILD_EDITABLE_SKIP="$editable_build_dir" python -m tools.gate_measure --write benchmarks/results/gate_vectors.json --table benchmarks/results/gate_vectors.md''', depends-on = ["_editable-rebuild"], description = "Re-measure every gate case (caps x generators x pockets); rewrite the pinned vectors and the docs table" }
pipeline-timing = { cmd = '''editable_build_dir="$(python -c 'import sys; print(next(f.path for f in sys.meta_path if hasattr(f, "known_wheel_files") and "compas_cgal._stock_2" in f.known_wheel_files))')" && SKBUILD_EDITABLE_SKIP="$editable_build_dir" python -m tools.pipeline_timing --write benchmarks/results/pipeline_timing.json --table benchmarks/results/pipeline_timing.md''', depends-on = ["_editable-rebuild"], description = "Time every gate case serially (one case at a time, fresh process per run, median of 3); rewrite the timing results and their docs table" }
performance-profile = { cmd = '''editable_build_dir="$(python -c 'import sys; print(next(f.path for f in sys.meta_path if hasattr(f, "known_wheel_files") and "compas_cgal._stock_2" in f.known_wheel_files))')" && SKBUILD_EDITABLE_SKIP="$editable_build_dir" python -m tools.performance_profile''', depends-on = ["_editable-rebuild"], description = "cProfile every performance workload (Held Figure 5, crossed skis, pipeline and rho gate cases), one fresh process each, into build/performance/" }
performance-figures = { cmd = "python -m tools.performance_heatmap && python -m tools.performance_lever_heatmap && python -m tools.performance_callpaths", depends-on = ["performance-profile"], description = "Profile, then redraw docs/assets/images/performance_time_heatmap.png and docs/assets/images/performance_lever_heatmap.png from the committed benchmarks/results/performance_levers.json, and rewrite benchmarks/results/performance_{time_buckets,lever_shares}.json and performance_fig5_callpaths.md" }
gate-ratchet = { cmd = '''editable_build_dir="$(python -c 'import sys; print(next(f.path for f in sys.meta_path if hasattr(f, "known_wheel_files") and "compas_cgal._stock_2" in f.known_wheel_files))')" && SKBUILD_EDITABLE_SKIP="$editable_build_dir" python -m tools.gate_ratchet check --head HEAD --fresh''', depends-on = ["_editable-rebuild"], description = "Ratchet every commit of GATE_BASE..HEAD (default HEAD^..HEAD), then re-measure for freshness" }
gate-ratchet-commits = { cmd = "python -m tools.gate_ratchet check --head HEAD", description = "Ratchet every commit of GATE_BASE..HEAD (default HEAD^..HEAD) from the committed vectors; no measurement" }
held-boundary-census = { cmd = '''editable_build_dir="$(python -c 'import sys; print(next(f.path for f in sys.meta_path if hasattr(f, "known_wheel_files") and "compas_cgal._stock_2" in f.known_wheel_files))')" && SKBUILD_EDITABLE_SKIP="$editable_build_dir" python -m tools.held_boundary_census && SKBUILD_EDITABLE_SKIP="$editable_build_dir" python -m tools.held_declared_boundary_census''', description = "Exact number census of the stored Held boundaries, then re-emit the declared (Pythagorean) boundaries, re-certify them against the publisher evidence and time it; writes benchmarks/results/held_{boundary_census,declared_boundary}.json. Python only, no native rebuild" }
gate-fresh = { cmd = '''editable_build_dir="$(python -c 'import sys; print(next(f.path for f in sys.meta_path if hasattr(f, "known_wheel_files") and "compas_cgal._stock_2" in f.known_wheel_files))')" && SKBUILD_EDITABLE_SKIP="$editable_build_dir" python -m tools.gate_ratchet fresh''', depends-on = ["_editable-rebuild"], description = "Re-measure the working tree; gated cells and reported integers must equal the committed vectors" }
plan-headers = { cmd = "python -m tools.plan_headers", description = "Every SDD plan carries a status header (I4)" }
affected = { cmd = '''editable_build_dir="$(python -c 'import sys; print(next(f.path for f in sys.meta_path if hasattr(f, "known_wheel_files") and "compas_cgal._stock_2" in f.known_wheel_files))')" && SKBUILD_EDITABLE_SKIP="$editable_build_dir" pytest tests -n auto --testmon -q''', depends-on = ["_editable-rebuild"] }
lint = "ruff check src/compas_cgal tests"
# Figures are regenerated through the same editable-extension dance the test
# tasks use: the recipe generates real tool paths, so it needs the built kernel
# matched to this interpreter, not whatever `python` happens to resolve to.
figures = { cmd = '''editable_build_dir="$(python -c 'import sys; print(next(f.path for f in sys.meta_path if hasattr(f, "known_wheel_files") and "compas_cgal._stock_2" in f.known_wheel_files))')" && SKBUILD_EDITABLE_SKIP="$editable_build_dir" python -m benchmarks.cli figures''', depends-on = ["_editable-rebuild"], description = "Redraw every published tool-path figure" }
gate-figures = { cmd = '''editable_build_dir="$(python -c 'import sys; print(next(f.path for f in sys.meta_path if hasattr(f, "known_wheel_files") and "compas_cgal._stock_2" in f.known_wheel_files))')" && SKBUILD_EDITABLE_SKIP="$editable_build_dir" python -m benchmarks.gate_figures --check-fresh''', depends-on = ["_editable-rebuild"], description = "Redraw the gate toolpath figures (every generator x pocket x cap) into docs/assets/images/pipeline/{120,40}/; refuses captions the code no longer reproduces" }
format-adaptive = "ruff format src/compas_cgal/adaptive tests/adaptive"
types-adaptive = "mypy --strict --warn-unused-ignores src/compas_cgal/adaptive tests/adaptive/typecheck/consumer_contract.py"
types-pipeline = "mypy --strict --warn-unused-ignores src/compas_cgal/pipeline src/compas_cgal/helix.py src/compas_cgal/helix_units.py tests/pipeline/typecheck/pipeline_contract.py"
types-audit = "mypy --strict --warn-unused-ignores src/compas_cgal/engagement_audit src/compas_cgal/adaptive/motion.py tests/adaptive/typecheck/auditor_contract.py"
types-benchmarks = "mypy --strict --warn-unused-ignores src/compas_cgal/replay_classification.py src/compas_cgal/incident_loop.py benchmarks/units.py benchmarks/survey.py benchmarks/helix_observation.py benchmarks/survey_station.py benchmarks/held_path_snapshot.py benchmarks/held_path_evidence.py benchmarks/held_consumer_adapters.py benchmarks/held_path_characterize.py benchmarks/held_path_report.py benchmarks/held_post_qualification.py benchmarks/quality_observations.py benchmarks/quality_criteria.py benchmarks/quality_binding.py benchmarks/depletion.py tools/gate_vectors.py tools/gate_measure.py tools/gate_ratchet.py tools/gate_table.py tools/gate_admissions.py tools/gate_case_keys.py tools/pipeline_timing.py tools/pipeline_timing_results.py tools/pipeline_timing_table.py benchmarks/stage_acceptance.py benchmarks/held_reference_certification.py benchmarks/held_reference_geometry.py benchmarks/held_reference_cases.py benchmarks/held_reference_figures.py tools/held_path_characterization.py tools/held_reference_extractor.py tools/held_reference_case_generator.py tools/held_reference_qualification.py tests/benchmarks/typecheck/held_path_characterization_contract.py tests/benchmarks/typecheck/quality_observations_contract.py tests/benchmarks/typecheck/held_reference_contract.py tests/benchmarks/typecheck/held_reference_cases_contract.py tests/benchmarks/typecheck/held_reference_figures_contract.py tests/tools/typecheck/held_path_characterization_contract.py tests/tools/typecheck/held_reference_extractor_contract.py tests/tools/typecheck/held_reference_qualification_contract.py benchmarks/held_coverage_repair.py benchmarks/held_coverage_repair_cover.py benchmarks/held_coverage_repair_errors.py benchmarks/held_coverage_repair_splice.py benchmarks/held_coverage_repair_types.py benchmarks/held_figure5_engagement_refinement.py tools/coverage_certificate_acceptance.py tools/coverage_certificate_omega_star.py benchmarks/held_coverage_repair_invariant_errors.py benchmarks/held_figure5_engagement_errors.py benchmarks/held_figure5_engagement_trace.py benchmarks/held_figure5_connector_gate.py benchmarks/held_figure5_engagement_circles.py"
held-figure5-characterize = { cmd = "python -m tools.held_path_characterization", depends-on = ["_editable-rebuild"], description = "Characterize the default generator on Held Figure 5" }
held-figure5-characterize-live = { cmd = '''editable_build_dir="$(python -c 'import sys; print(next(f.path for f in sys.meta_path if hasattr(f, "known_wheel_files") and "compas_cgal._stock_2" in f.known_wheel_files))')" && SKBUILD_EDITABLE_SKIP="$editable_build_dir" pytest tests/benchmarks/held_figure5_path_live_oracle.py -n auto -q -s''', depends-on = ["_editable-rebuild"], description = "Run the Held Figure 5 2D path oracle" }
held-reference-extract = { cmd = "python -m tools.held_reference_extractor", description = "Extract Held-Pfeiffer reference vectors" }
held-reference-generate = { cmd = "python -m tools.held_reference_case_generator", description = "Generate Held-Pfeiffer reference cases" }
held-reference-figures = { cmd = "python -m benchmarks.held_reference_figures", description = "Render Held reference reconstruction overlays" }
held-figure5-reference-guided = { cmd = "python -m benchmarks.tools.held_figure5_reference_guided", depends-on = ["_editable-rebuild"], description = "Render Figure 5 reference-guided circle correspondence" }
held-figure5-exact-connector = { cmd = "python -m benchmarks.tools.held_exact_boundary_progress", depends-on = ["_editable-rebuild"], description = "Plot native Figure 5 boundary contacts and CCW connectors" }
held-native-boundary-draft = { cmd = "python -m benchmarks.held_native_boundary_draft", depends-on = ["_editable-rebuild"], description = "Plot exact boundary-normal circle construction for a Held pocket" }
held-boundary-domain-audit = { cmd = "python -m benchmarks.held_boundary_domain_audit", description = "Plot prepared curve joins and polygonization across all Held pockets" }
held-figure5-toolpath-progress = { cmd = "python -m benchmarks.tools.held_toolpath_progress", depends-on = ["_editable-rebuild"], description = "Plot every Figure 5 motion and final-order engagement failures" }
held-figure6-same-axes = { cmd = "python -m benchmarks.tools.held_figure6_same_axes", depends-on = ["_editable-rebuild"], description = "Render bounded Figure 6 same-axes comparison" }
held-figure5-publisher-check = { cmd = "python -m tools.held_figure5_publisher_check", description = "Check tracked Figure 5 publisher evidence against an official SVG" }
held-reference-qualify = { cmd = "python -m tools.held_reference_qualification", depends-on = ["_editable-rebuild"], description = "Qualify the generator on Held reference pockets" }
held-reference-toolpaths = { cmd = "python -m benchmarks.tools.held_reference_toolpaths", depends-on = ["_editable-rebuild"], description = "Render standard-model drafts from prepared Figure 5/8 inputs" }
held-contour-bound-toolpaths = { cmd = "python -m benchmarks.tools.held_contour_bound_toolpaths", depends-on = ["_editable-rebuild"], description = "Generate contour-clearance-bound drafts and compare standard paths" }
held-coverage-corpus = { cmd = "PYTEST_XDIST_AUTO_NUM_WORKERS=2 pytest benchmarks/acceptance -n auto --dist loadgroup --testmon --testmon-noselect --basetemp=build/held-coverage-corpus/pytest -q", depends-on = ["_editable-rebuild"], description = "Exact full-motion coverage replay corpus: NOT run by pytest, set aside 2026-09-08 as unworkable at this size (docs/held_motion_coverage.md); run deliberately" }
held-reference-live = { cmd = '''editable_build_dir="$(python -c 'import sys; print(next(f.path for f in sys.meta_path if hasattr(f, "known_wheel_files") and "compas_cgal._stock_2" in f.known_wheel_files))')" && SKBUILD_EDITABLE_SKIP="$editable_build_dir" pytest tests/tools/held_reference_live_pdf_oracle.py -n auto -q''', depends-on = ["_editable-rebuild"], description = "Verify Held-Pfeiffer vectors against the local publisher PDF" }
held-reference-reconstruct-live = { cmd = '''editable_build_dir="$(python -c 'import sys; print(next(f.path for f in sys.meta_path if hasattr(f, "known_wheel_files") and "compas_cgal._stock_2" in f.known_wheel_files))')" && SKBUILD_EDITABLE_SKIP="$editable_build_dir" pytest tests/benchmarks/held_reference_live_reconstruction_oracle.py -n auto -q''', depends-on = ["_editable-rebuild"], description = "Reconstruct Held-Pfeiffer reference cycles from the local publisher PDF" }
schema = { cmd = '''editable_build_dir="$(python -c 'import sys; print(next(f.path for f in sys.meta_path if hasattr(f, "known_wheel_files") and "compas_cgal._stock_2" in f.known_wheel_files))')" && SKBUILD_EDITABLE_SKIP="$editable_build_dir" pytest tests/adaptive/test_schema.py -n auto -q''', depends-on = ["_editable-rebuild"] }
mutations-adaptive = "python scripts/run-adaptive-mutations.py"
wheel = "python -m build --wheel --no-isolation"
_native-lock-configure = "cmake -S . -B build/native-lock-check -G Ninja -Dnanobind_DIR=$(python -m nanobind --cmake_dir)"
_native-lock-build = "cmake --build build/native-lock-check --target external_downloads"
native-lock-check = { depends-on = ["_native-lock-configure", "_native-lock-build"], description = "Verify locked native archives and source trees" }
_task3-gate-configure = "cmake -S . -B build/task3-algorithm -G Ninja -Dnanobind_DIR=$(python -m nanobind --cmake_dir)"
_task3-gate-build = "cmake --build build/task3-algorithm --target task3_algorithm_gate"
_task3-gate-run = "build/task3-algorithm/task3_algorithm_gate"
task3-algorithm-gate = { depends-on = ["_task3-gate-configure", "_task3-gate-build", "_task3-gate-run"], description = "Prove bounded exact Task 3 construction" }

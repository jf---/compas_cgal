[build-system]
requires = ["scikit-build-core >=0.10", "nanobind >=1.3.2"]
build-backend = "scikit_build_core.build"

[project]
name = "compas_cgal"
description = "CGAL wrapper for COMPAS."
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "tom van mele", email = "tom.v.mele@gmail.com" },
    { name = "Petras Vestartas", email = "petrasvestartas@gmail.com" },
]
classifiers = [
    "License :: OSI Approved :: GNU Lesser General Public License v3 (LGPLv3)",
]
dependencies = [
    "compas",
    "numpy",
    "scipy",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/compas-dev/compas_cgal"

# ============================================================================
# replace pytest.ini
# ============================================================================

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = ["tests"]
# The `benchmarks` corpus is a top-level source package that is deliberately not
# shipped in the wheel, so it is never installed. `--import-mode=importlib` does
# not put the rootdir on sys.path, so tests/benchmarks/* could not import it.
pythonpath = ["."]
python_files = ["test_*.py", "*_test.py", "test.py"]
norecursedirs = [
    "external/*",
    "build/*",
    "dist/*",
    "*.egg-info",
    ".git",
    ".tox",
    ".env",
    ".pytest_cache",
    ".ruff_cache",
    ".hypothesis",
]
addopts = [
    "-ra",
    "--strict-markers",
    "--doctest-glob=*.rst",
    "--tb=short",
    "--import-mode=importlib",
]
doctest_optionflags = [
    "NORMALIZE_WHITESPACE",
    "IGNORE_EXCEPTION_DETAIL",
    "ALLOW_UNICODE",
    "ALLOW_BYTES",
    "NUMBER",
]

# ============================================================================
# scikit-build
# ============================================================================

[tool.scikit-build]
minimum-version = "build-system.requires"
build-dir = "build/{wheel_tag}"
wheel.py-api = "cp312"                    # Build all Python currently supported versions.
cmake.version = ">=3.15"
cmake.build-type = "Release"
editable.rebuild = true
# Pixi passes its frontend-owned `pixi-conda-environment` PEP 517 setting.
strict-config = false

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "src/compas_cgal/__init__.py"

[tool.scikit-build.cmake.define]
CMAKE_POLICY_DEFAULT_CMP0135 = "NEW"
CMAKE_OSX_DEPLOYMENT_TARGET = "11.0"

# ============================================================================
# cibuildwheel
# ============================================================================

[tool.cibuildwheel]
# build = ["cp38-*", "cp39-*", "cp31?-*"] # Build for specific Python versions.
build-verbosity = 3
test-requires = ["numpy", "compas", "pytest", "build"]
test-command = "pip install numpy compas && pip list && pytest {project}/tests"
build-frontend = "pip"
manylinux-x86_64-image = "manylinux2014"
skip = ["*_i686", "*-musllinux_*", "*-win32", "pp*"]
macos.environment.MACOSX_DEPLOYMENT_TARGET = "11.00"
macos.archs = ["x86_64", "arm64"]

# ============================================================================
# replace bumpversion.cfg
# ============================================================================

[tool.bumpversion]
current_version = "0.9.1"
message = "Bump version to {new_version}"
commit = true
tag = true

[[tool.bumpversion.files]]
filename = "src/compas_cgal/__init__.py"
search = "{current_version}"
replace = "{new_version}"

[[tool.bumpversion.files]]
filename = "CHANGELOG.md"
search = "Unreleased"
replace = "[{new_version}] {now:%Y-%m-%d}"

# ============================================================================
# replace setup.cfg
# ============================================================================

[tool.ruff]
line-length = 179
indent-width = 4
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["I001"]
"tests/*" = ["I001"]
"tasks.py" = ["I001"]

[tool.ruff.lint.isort]
force-single-line = true

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.pycodestyle]
max-doc-length = 179

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = "dynamic"

# ============================================================================
# pixi
# ============================================================================

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64"]

[tool.pixi.dependencies]
python = "3.12.*"
cmake = ">=3.15"
ninja = "*"
compas = "*"
numpy = "*"
scipy = "*"

[tool.pixi.pypi-dependencies]
compas-cgal = { path = ".", editable = true }
nanobind = ">=1.3.2"
scikit-build-core = ">=0.10"
build = "*"
pytest = ">=7"
pytest-xdist = "*"
pytest-testmon = "*"
hypothesis = "*"
ruff = "*"
mypy = "*"
jsonschema = "*"
# Figures only. `benchmarks.plotting` is the one importer; nothing under `src`
# depends on it, so the wheel never sees it.
matplotlib = ">=3.8"

[tool.pixi.pypi-options]
no-build-isolation = ["compas-cgal"]

[tool.pixi.feature.docs.dependencies]
python = "3.12.*"
compas = "*"

[tool.pixi.feature.docs.pypi-dependencies]
markdown-callouts = ">=0.4"
mkdocs-material = ">=9.5"
mkdocstrings = { version = "*", extras = ["python"] }

[tool.pixi.feature.docs.tasks]
docs = "mkdocs build --strict"

[tool.pixi.environments]
docs = { features = ["docs"], no-default-feature = true }

[tool.pixi.tasks]
_editable-rebuild = '''python -c "from compas_cgal import _containment_2, _coverage_2, _medial_axis_2, _stock_2, _toolpath"'''
pytest = { cmd = '''editable_build_dir="$(python -c 'import sys; print(next(f.path for f in sys.meta_path if hasattr(f, "known_wheel_files") and "compas_cgal._stock_2" in f.known_wheel_files))')" && SKBUILD_EDITABLE_SKIP="$editable_build_dir" pytest''', depends-on = ["_editable-rebuild"] }
baseline = { cmd = '''editable_build_dir="$(python -c 'import sys; print(next(f.path for f in sys.meta_path if hasattr(f, "known_wheel_files") and "compas_cgal._stock_2" in f.known_wheel_files))')" && SKBUILD_EDITABLE_SKIP="$editable_build_dir" pytest tests -n auto --dist=loadgroup -q''', depends-on = ["_editable-rebuild"] }
# Exit 1 carries deliberate reds in JUnit for the manifest checker to decide.
# Exit 2+ is infrastructure/collection failure and must stop the task chain.
# loadgroup co-locates only explicitly marked expensive module fixtures.
_junit-baseline = { cmd = '''sh -c 'editable_build_dir="$(python -c "import sys; print(next(f.path for f in sys.meta_path if hasattr(f, \"known_wheel_files\") and \"compas_cgal._stock_2\" in f.known_wheel_files))")" || exit $?; SKBUILD_EDITABLE_SKIP="$editable_build_dir" pytest tests -n auto --dist=loadgroup -q --junitxml=build/junit-baseline.xml; pytest_status=$?; if [ "$pytest_status" -le 1 ]; then exit 0; fi; exit "$pytest_status"' ''', depends-on = ["_editable-rebuild"] }
red-manifest = { cmd = "python -m tools.red_manifest build/junit-baseline.xml", depends-on = ["_junit-baseline"], description = "Suite reds must equal docs/red_manifest.json, both directions" }
plan-headers = { cmd = "python -m tools.plan_headers", description = "Every SDD plan carries a status header (I4)" }
measured-run = { cmd = '''editable_build_dir="$(python -c 'import sys; print(next(f.path for f in sys.meta_path if hasattr(f, "known_wheel_files") and "compas_cgal._stock_2" in f.known_wheel_files))')" && SKBUILD_EDITABLE_SKIP="$editable_build_dir" python -m tools.measured_run''', depends-on = ["_editable-rebuild"], description = "Corpus run with authenticated provenance under benchmarks/results/" }
measurement-claims-generator = { cmd = "python -m tools.measurement_claim_probes run-generator --all", depends-on = ["_editable-rebuild"], description = "Run the authenticated generator measurement-claim batch" }
measurement-claims-validate = { cmd = "python -m tools.measurement_claim_probes validate", description = "Validate one authenticated generator measurement-claim artifact" }
affected = { cmd = '''editable_build_dir="$(python -c 'import sys; print(next(f.path for f in sys.meta_path if hasattr(f, "known_wheel_files") and "compas_cgal._stock_2" in f.known_wheel_files))')" && SKBUILD_EDITABLE_SKIP="$editable_build_dir" pytest tests -n auto --testmon -q''', depends-on = ["_editable-rebuild"] }
lint = "ruff check src/compas_cgal tests"
# Figures are regenerated through the same editable-extension dance the test
# tasks use: the recipe generates real tool paths, so it needs the built kernel
# matched to this interpreter, not whatever `python` happens to resolve to.
figures = { cmd = '''editable_build_dir="$(python -c 'import sys; print(next(f.path for f in sys.meta_path if hasattr(f, "known_wheel_files") and "compas_cgal._stock_2" in f.known_wheel_files))')" && SKBUILD_EDITABLE_SKIP="$editable_build_dir" python -m benchmarks.cli figures''', depends-on = ["_editable-rebuild"], description = "Redraw every published tool-path figure" }
format-adaptive = "ruff format src/compas_cgal/adaptive tests/adaptive"
types-adaptive = "mypy --strict --warn-unused-ignores src/compas_cgal/adaptive tests/adaptive/typecheck/consumer_contract.py"
types-audit = "mypy --strict --warn-unused-ignores src/compas_cgal/engagement_audit src/compas_cgal/adaptive/motion.py tests/adaptive/typecheck/auditor_contract.py"
types-benchmarks = "mypy --strict --warn-unused-ignores benchmarks/held_reference_geometry.py tests/benchmarks/typecheck/held_reference_contract.py"
schema = { cmd = '''editable_build_dir="$(python -c 'import sys; print(next(f.path for f in sys.meta_path if hasattr(f, "known_wheel_files") and "compas_cgal._stock_2" in f.known_wheel_files))')" && SKBUILD_EDITABLE_SKIP="$editable_build_dir" pytest tests/adaptive/test_schema.py -n auto -q''', depends-on = ["_editable-rebuild"] }
mutations-adaptive = "python scripts/run-adaptive-mutations.py"
wheel = "python -m build --wheel --no-isolation"
_native-lock-configure = "cmake -S . -B build/native-lock-check -G Ninja -Dnanobind_DIR=$(python -m nanobind --cmake_dir)"
_native-lock-build = "cmake --build build/native-lock-check --target external_downloads"
native-lock-check = { depends-on = ["_native-lock-configure", "_native-lock-build"], description = "Verify locked native archives and source trees" }
_task3-gate-configure = "cmake -S . -B build/task3-algorithm -G Ninja -Dnanobind_DIR=$(python -m nanobind --cmake_dir)"
_task3-gate-build = "cmake --build build/task3-algorithm --target task3_algorithm_gate"
_task3-gate-run = "build/task3-algorithm/task3_algorithm_gate"
task3-algorithm-gate = { depends-on = ["_task3-gate-configure", "_task3-gate-build", "_task3-gate-run"], description = "Prove bounded exact Task 3 construction" }
_audit-native-configure = "cmake -S . -B build/audit-native -G Ninja -Dnanobind_DIR=$(python -m nanobind --cmake_dir)"
_audit-native-build = "cmake --build build/audit-native --target audit_native_gate _stock_2"
_audit-native-run = "build/audit-native/audit_native_gate"
_audit-native-stock = { cmd = "PYTEST_XDIST_AUTO_NUM_WORKERS=2 pytest tests/adaptive/test_exact_depletion.py -k exact_arc -n auto -q", depends-on = ["_editable-rebuild"] }
_audit-native-continuous = "PYTEST_XDIST_AUTO_NUM_WORKERS=2 pytest tests/adaptive/test_event_substrate.py::test_frozen_center_and_rim_charts_cover_each_seam_once tests/adaptive/test_event_substrate.py::test_exact_pullbacks_match_literal_coefficient_grids_and_bounds -n auto -q"
audit-native = { depends-on = ["_audit-native-configure", "_audit-native-build", "_audit-native-run", "_audit-native-stock", "_audit-native-continuous"], description = "Prove native engagement-audit contracts" }
_task9-mat-configure = "cmake -S . -B build/task9-mat -G Ninja -Dnanobind_DIR=$(python -m nanobind --cmake_dir)"
_task9-mat-build = "cmake --build build/task9-mat --target task9_mat_compile_gate"
_task9-mat-run = "build/task9-mat/task9_mat_compile_gate"
task9-mat-compile-gate = { depends-on = ["_task9-mat-configure", "_task9-mat-build", "_task9-mat-run"], description = "Compile exact segment-site MAT primitives" }

# ============================================================================
# mypy — strict typing gate for the benchmark corpus
# ============================================================================

# `benchmarks` is a top-level source package deliberately excluded from the
# wheel, and it is the one tree in this repository held to `strict` end to end.
# `files` names it so a bare `mypy` gates exactly that; the adaptive gate passes
# its own paths explicitly and is unaffected.
#
# NO python_version IS SET, and that is a gap rather than a choice: the corpus
# targets a 3.9 runtime (`from __future__ import annotations` everywhere, no
# runtime PEP 604 unions or PEP 585 generics), but mypy 2.x refuses any
# --python-version below 3.10, so no type checker in this environment can hold
# that floor. `tests/benchmarks/test_package_contract.py` holds the part that is
# mechanically checkable -- every module defers its annotations -- and the rest
# rests on review.
[tool.mypy]
strict = true
files = ["benchmarks", "tests/benchmarks/typecheck/gate_contract.py"]
warn_unused_configs = true

# compas ships no py.typed marker, so its symbols are untyped here. Following its
# sources instead would be better, but its transitive imports do not check clean
# under this configuration; the consequence is that compas geometry reads as Any
# inside `benchmarks`, and that is a real limit of this gate, not a formality.
[[tool.mypy.overrides]]
module = ["compas.*"]
ignore_missing_imports = true

# compas_cgal is this repository's own source and ships no py.typed marker
# either, but its sources ARE here, so they are followed rather than erased to
# Any -- the benchmark corpus's use of the kernel API is genuinely checked.
[[tool.mypy.overrides]]
module = ["compas_cgal.*"]
ignore_missing_imports = true
